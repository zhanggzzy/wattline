[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wattline"
version = "0.1.0"
description = "Standalone SSH-based Linux and NVIDIA monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34.2,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.1,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<2",
]

[project.scripts]
wattline = "wattline.__main__:main"

[tool.setuptools.packages.find]
include = ["wattline"]

[tool.setuptools.package-data]
wattline = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
