<!doctype html>
<html lang="zh-CN" data-localizing>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wattline</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/monitor.css">

</head>
<body>
<a class="skip-link" href="#main"><span data-i18n="skip_to_main_content">跳到主要内容</span></a>
<div class="shell">
  <aside class="rail">
    <div class="rail-inner">
      <div class="rail-brand"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-name">Wattline</span></div><button type="button" id="rail-toggle" class="rail-toggle" aria-controls="rail-nav" aria-expanded="true"></button></div>
      <p class="brand-caption"><span data-i18n="compute_resource_workbench">计算资源管理工作台</span></p>
      <nav aria-label="机器导航" data-i18n-aria-label="machine_navigation" id="rail-nav"></nav>
    </div>
  </aside>
  <div class="top">
    <header class="topbar">
      <nav class="breadcrumb" id="breadcrumb" aria-label="当前位置" data-i18n-aria-label="current_location"></nav>
      <div class="top-actions">
        <label class="locale-control"><span data-i18n="language">语言</span><select id="locale-select" aria-label="语言" data-i18n-aria-label="language"></select></label>
        <span class="status stale" id="sync-state"><span data-i18n="waiting_for_data">等待数据</span></span>
        <span class="time" id="clock"></span>
      </div>
    </header>
    <main class="content" id="main" tabindex="-1">
      <p class="message" id="sync-error" role="status" hidden></p>
      <div id="content" aria-busy="true"><div class="loading-state" role="status"><span class="loading-mark" aria-hidden="true"></span><h1><span data-i18n="connecting_to_workbench">正在连接工作台</span></h1><p><span data-i18n="loading_machines_and_latest_samples">正在读取机器清单与最新样本…</span></p></div></div>
    </main>
  </div>
</div>
<dialog class="machine-dialog" id="machine-dialog" aria-labelledby="machine-dialog-title">
  <form id="machine-form">
    <h2 id="machine-dialog-title"><span data-i18n="add_machine">新增机器</span></h2>
    <p id="machine-target" class="mono" hidden></p>
    <fieldset id="machine-fields" aria-label="机器设置" data-i18n-aria-label="machine_settings_m174">
      <label><span data-i18n="resource_kind">硬件类型</span><select name="hardware_kind">
        <option value="" data-i18n="automatic_type">自动识别</option><option value="cpu">CPU</option>
        <option value="gpu">GPU</option><option value="storage" data-i18n="storage_resource">存储</option>
      </select></label>
      <fieldset id="storage-fields" hidden disabled>
        <div class="form-grid">
          <label><span data-i18n="device_name">设备名称</span><input name="storage_name" type="text" maxlength="80" required></label>
          <label><span data-i18n="storage_resource">存储</span><select name="storage_kind">
            <option value="nas">NAS</option><option value="storage_cluster" data-i18n="storage_cluster">共享存储集群</option>
          </select></label>
          <label><span data-i18n="storage_adapter">采集适配器</span><select name="adapter"></select></label>
        </div>
        <label class="check-label"><input name="storage_enabled" type="checkbox" checked><span data-i18n="enable_background_monitoring">启用后台巡检</span></label>
      </fieldset>
      <fieldset id="compute-fields">
      <div id="machine-connection" class="form-grid">
        <label><span data-i18n="ip_or_hostname">IP 或主机名</span><input name="host" type="text" maxlength="128" placeholder="例如 jg04" data-i18n-placeholder="e_g_jg04" autocomplete="off" spellcheck="false" required></label>
        <label><span data-i18n="ssh_username">SSH 用户名 </span><small><span data-i18n="optional">可选</span></small><input name="ssh_user" type="text" maxlength="64" placeholder="按现有 SSH 配置" data-i18n-placeholder="use_existing_ssh_configuration" autocomplete="off" spellcheck="false"></label>
        <label><span data-i18n="target_operating_system">目标操作系统</span><select name="target_os"><option value="linux">Linux</option><option value="windows">Windows</option></select></label>
        <p class="full-width"><span data-i18n="an_existing_ssh_alias_also_works_saving_verifies_public_key_login">也可填写已有 SSH 别名。保存时会验证公钥登录和已信任的主机密钥。</span></p>
      </div>
      <div class="form-grid">
        <label><span data-i18n="display_alias">显示别名</span><input name="alias" type="text" maxlength="80" placeholder="留空使用默认名称" data-i18n-placeholder="leave_blank_for_default_name" autocomplete="off"></label>
        <label><span data-i18n="check_interval_seconds">巡检间隔（秒）</span><input name="interval_seconds" type="number" min="1" max="300" step="any" required></label>
        <label id="ssh-timeout-field"><span data-i18n="ssh_connection_timeout_seconds">SSH 连接超时（秒）</span><input name="ssh_connect_timeout_seconds" type="number" min="1" max="60" step="1" required></label>
      </div>
      <label class="check-label"><input name="enabled" type="checkbox"><span data-i18n="enable_background_monitoring">启用后台巡检</span></label>
      <fieldset class="check-options">
        <legend><span data-i18n="monitoring_checks">巡检项目</span></legend>
        <label class="check-label"><input name="checks" type="checkbox" value="gpu"><span data-i18n="gpu_metrics">GPU 指标</span></label>
        <label class="check-label"><input name="checks" type="checkbox" value="processes"><span data-i18n="gpu_processes_and_ownership">GPU 进程与归属</span></label>
        <label class="check-label"><input name="checks" type="checkbox" value="cpu"><span data-i18n="cpu_and_load">CPU 与负载</span></label>
        <label class="check-label"><input name="checks" type="checkbox" value="memory"><span data-i18n="memory">内存</span></label>
        <label class="check-label"><input name="checks" type="checkbox" value="system"><span data-i18n="system_disk_and_uptime">系统盘与运行时长</span></label>
      </fieldset>
      </fieldset>
      <label id="registration-room" hidden><span data-i18n="rooms">机房</span><select name="room_id" disabled></select></label>
      <label id="registration-user"><span data-i18n="assignees">使用人</span><select name="resource_user"></select></label>
    </fieldset>
    <p id="machine-error" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button id="machine-cancel" type="button" class="control"><span data-i18n="cancel">取消</span></button>
      <button id="machine-save" type="submit" class="control primary-control" data-i18n="save">保存</button>
    </div>
  </form>
</dialog>
<dialog class="machine-dialog" id="assignee-dialog" aria-labelledby="assignee-title">
  <form id="assignee-form">
    <h2 id="assignee-title" data-i18n="assignees">使用者</h2>
    <p id="assignee-machine"></p>
    <label id="assignee-mode-field"><span data-i18n="resource_user_mode">使用人</span><select id="assignee-mode">
      <option value="unset" data-i18n="unassigned">未设置</option>
      <option value="shared" data-i18n="shared_user">共享</option>
      <option value="person" data-i18n="individual_user">指定人员</option>
      <option value="legacy" data-i18n="legacy_users">原有多人</option>
    </select></label>
    <div class="assignee-picker-head">
      <p data-i18n="choose_from_people_directory">从人员名单选择</p>
      <p id="assignee-count" role="status" aria-live="polite"></p>
    </div>
    <fieldset id="assignee-options" aria-label="使用者" data-i18n-aria-label="assignees"></fieldset>
    <div class="people-actions">
      <button id="assignee-manage" type="button" class="control" data-i18n="people_directory">人员名单</button>
      <button id="assignee-clear" type="button" class="control" data-i18n="clear_selection">清空选择</button>
    </div>
    <p id="assignee-error" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button id="assignee-cancel" type="button" class="control" data-i18n="cancel">取消</button>
      <button id="assignee-save" type="submit" class="control primary-control" data-i18n="save">保存</button>
    </div>
  </form>
</dialog>
<dialog class="machine-dialog" id="people-dialog" aria-labelledby="people-title">
  <form id="people-form">
    <h2 id="people-title" data-i18n="people_directory">人员名单</h2>
    <input id="people-search" type="search" class="search" data-i18n-aria-label="people_search" data-i18n-placeholder="people_search">
    <ul id="people-list" class="people-list"></ul>
    <p id="people-empty" data-i18n="no_people">名单中还没有人员。</p>
    <fieldset id="people-edit-fields">
      <label><span data-i18n="person_name">人员姓名</span><textarea name="name" rows="1" autocomplete="off" enterkeyhint="done"></textarea></label>
      <div class="people-actions">
        <button id="people-save" type="submit" class="control primary-control" data-i18n="add_person">新增人员</button>
        <button id="people-cancel-edit" type="button" class="control" data-i18n="cancel_rename" hidden>取消改名</button>
      </div>
    </fieldset>
    <p id="people-error" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="people-close" type="button" class="control" data-i18n="close_people">关闭名单</button></div>
  </form>
</dialog>
<dialog class="machine-dialog" id="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-description">
  <form id="remove-form">
    <h2 id="remove-title"><span data-i18n="remove_node_m193">移除节点？</span></h2>
    <p><strong id="remove-name"></strong> <span class="mono" id="remove-address"></span></p>
    <p id="remove-description"><span data-i18n="stops_monitoring_and_deletes_this_node_s_configuration_and_all_mo">将停止巡检，删除该节点的配置和全部监控数据，包括冷归档。此操作不可撤销。</span></p>
    <p id="remove-error" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button id="remove-cancel" type="button" class="control" autofocus><span data-i18n="cancel">取消</span></button>
      <button id="remove-confirm" type="submit" class="control danger-confirm" data-i18n="confirm_removal">确认移除</button>
    </div>
  </form>
</dialog>
<dialog class="machine-dialog gpu-dialog" id="gpu-dialog" aria-labelledby="gpu-dialog-title">
  <div class="panel-head"><h2 id="gpu-dialog-title"></h2><form method="dialog"><button type="submit" class="control" autofocus data-i18n="close_details">关闭详情</button></form></div>
  <div id="gpu-dialog-content"></div>
  <div class="dialog-actions gpu-dialog-actions"><button type="button" class="control primary-control" data-gpu-trends data-i18n="gpu_trends">查看此 GPU 趋势</button></div>
</dialog>
<dialog class="machine-dialog" id="group-dialog" aria-labelledby="group-dialog-title">
  <form id="group-form">
    <h2 id="group-dialog-title"></h2>
    <fieldset id="group-fields">
      <label><span data-i18n="group_name">名称</span><input name="group_name" maxlength="80" required></label>
      <label id="group-location-field"><span data-i18n="room_location">位置</span><input name="location" maxlength="128"></label>
      <label><span id="group-person-label"></span><select name="person"></select></label>
      <fieldset id="group-members-field">
        <legend data-i18n="group_members">成员</legend>
        <input name="member_search" type="search" class="search" data-i18n-aria-label="group_member_search" data-i18n-placeholder="group_member_search">
        <div id="group-member-options"></div>
      </fieldset>
    </fieldset>
    <div id="group-delete-preview" hidden></div>
    <p id="group-error" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="group-cancel" type="button" class="control" data-i18n="cancel">取消</button>
      <button id="group-save" type="submit" class="control primary-control" data-i18n="save">保存</button></div>
  </form>
</dialog>
<script src="/static/locales.js" defer></script>
<script src="/static/i18n.js" defer></script>
<script src="/static/groups.js" defer></script>
<script src="/static/monitor.js" defer></script>
</body>
</html>
